name: build-wasm
on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Пересобрать out.wasm, игнорируя кэш"
        type: boolean
        default: false
      publish_branch:
        description: "Ветка для публикации site/ (пусто = только артефакт). Внимание: ветка перезаписывается!"
        type: string
        default: ""
      chunk_size:
        description: "Размер куска out.wasm (split: k/m). Пусто → переменная CHUNK_SIZE → дефолт 2500k."
        type: string
        default: ""

env:
  C2W_VERSION: v0.8.4

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # нужно для пуша в ветку публикации
    steps:
      - uses: actions/checkout@v4

      # Кэшируем готовый out.wasm по версии c2w + хешу my.Dockerfile.
      # Пока контейнер не менялся — пропускаем QEMU + docker build + c2w (самое долгое).
      - name: Cache built wasm
        id: wasmcache
        uses: actions/cache@v4
        with:
          # вне site/ — иначе split/удаление сломали бы post-job сохранение кэша
          path: c2w-cache/out.wasm
          key: out-wasm-${{ env.C2W_VERSION }}-${{ hashFiles('my.Dockerfile') }}

      - name: Set build flag
        id: need
        run: |
          if [ "${{ steps.wasmcache.outputs.cache-hit }}" = "true" ] \
             && [ "${{ github.event.inputs.force_rebuild }}" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "out.wasm взят из кэша — сборку контейнера пропускаем"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "out.wasm будет собран"
          fi

      - name: Setup QEMU
        if: steps.need.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - name: Setup Buildx
        if: steps.need.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Install c2w
        if: steps.need.outputs.build == 'true'
        run: |
          curl -sSL -o c2w.tar.gz \
            "https://github.com/container2wasm/container2wasm/releases/download/${C2W_VERSION}/container2wasm-${C2W_VERSION}-linux-amd64.tar.gz"
          tar xzf c2w.tar.gz
          sudo install -m755 c2w /usr/local/bin/c2w

      # docker build с GHA layer-cache: эмулированный apk берётся из кэша слоёв,
      # когда Dockerfile не менялся (например, бамп версии c2w).
      - name: Build rootfs image
        if: steps.need.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: my.Dockerfile
          platforms: linux/riscv64
          tags: myrootfs
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Convert to wasm
        if: steps.need.outputs.build == 'true'
        run: |
          mkdir -p c2w-cache
          c2w --target-arch=riscv64 myrootfs c2w-cache/out.wasm
          ls -lh c2w-cache/out.wasm

      - name: Assemble site
        run: |
          mkdir -p site
          # JS-glue из примера (worker.js, stack.js, ws-delegate.js, stack-worker.js, xterm-pty.conf и т.д.)
          cp -R examples/wasi-browser/htdocs/* site/

          # сетевой прокси-wasm
          curl -sSL -o site/c2w-net-proxy.wasm \
            "https://github.com/container2wasm/container2wasm/releases/download/${C2W_VERSION}/c2w-net-proxy.wasm"

          # COOP/COEP через service worker
          curl -sSL -o site/coi-serviceworker.js \
            "https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js"

          # вендорим xterm локально (никаких CDN)
          curl -sSL -o site/xterm.css      "https://cdn.jsdelivr.net/npm/xterm@4.17.0/css/xterm.css"
          curl -sSL -o site/xterm.min.js   "https://cdn.jsdelivr.net/npm/xterm@4.17.0/lib/xterm.min.js"
          curl -sSL -o site/xterm-pty.js   "https://cdn.jsdelivr.net/npm/xterm-pty@0.9.4/index.js"
          # workerTools грузится через importScripts в worker.js — тоже локально
          curl -sSL -o site/xterm-pty-workerTools.js "https://cdn.jsdelivr.net/npm/xterm-pty@0.9.4/workerTools.js"

          # наш index.html поверх примерного
          cp custom-index.html site/index.html

          touch site/.nojekyll

      - name: Split wasm
        env:
          INPUT_CHUNK_SIZE: ${{ github.event.inputs.chunk_size }}  # приоритет
          CHUNK_SIZE: ${{ vars.CHUNK_SIZE }}                       # переменная репозитория
        run: |
          # GitVerse Pages обрывает отдачу больших файлов (~5 МБ) → дробим мелко.
          # Размер куска: инпут chunk_size → переменная CHUNK_SIZE → дефолт 2500k.
          # split -d -a 3 → part000, part001, ...
          # читаем из кэша (c2w-cache/out.wasm), пишем куски в site/ — целого wasm в site/ не будет
          SIZE="${INPUT_CHUNK_SIZE:-${CHUNK_SIZE:-2500k}}"
          echo "chunk size: $SIZE"
          split -b "$SIZE" -d -a 3 c2w-cache/out.wasm site/out.wasm.part
          ls site/out.wasm.part* | wc -l | tr -d ' ' > site/out.wasm.parts
          echo "parts: $(cat site/out.wasm.parts)"
          ls -lh site/out.wasm.part*

      - name: Verify
        run: |
          AUTHORED="site/index.html site/worker.js site/stack.js site/ws-delegate.js \
                    site/stack-worker.js site/worker-util.js site/wasi-util.js"

          echo "=== внешние ресурсы (script/link/importScripts/fetch на http(s)://) — hard fail ==="
          # Ловим только реальные рантайм-загрузки с внешнего хоста. Внутренний прокси
          # http://192.168.127.253 (netParam browser) и URL в комментариях — не запросы.
          PAT='(src|href)[[:space:]]*=[[:space:]]*["'\'']https?://|importScripts\(["'\'']https?://|fetch\(["'\'']https?://'
          if grep -rEn "$PAT" $AUTHORED; then
            echo "FAIL: внешняя загрузка ресурса в авторском файле"; exit 1
          fi
          echo "ok: внешних загрузок в авторских html/js нет"

          echo "=== (инфо) любые упоминания http(s):// в авторских файлах (комментарии/прокси) ==="
          grep -rn "https\?://" $AUTHORED || echo "нет"

          echo "=== (инфо) ссылки в vendored-библиотеках, если есть ==="
          grep -rn "https\?://" site/xterm.min.js site/xterm-pty.js \
               site/xterm-pty-workerTools.js site/coi-serviceworker.js || echo "нет"

          echo "=== проверка магического числа \0asm после склейки кусков ==="
          cat site/out.wasm.part* > /tmp/reassembled.wasm
          printf "reassembled out.wasm: "; head -c4 /tmp/reassembled.wasm | xxd
          if [ "$(head -c4 /tmp/reassembled.wasm | xxd -p)" != "0061736d" ]; then
            echo "FAIL: склейка не даёт валидный wasm (\0asm)"; exit 1
          fi
          printf "c2w-net-proxy.wasm:   "; head -c4 site/c2w-net-proxy.wasm | xxd

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/

      # Публикация содержимого site/ в указанную ветку (orphan, force-push — как gh-pages).
      # Запускается только если задан publish_branch.
      - name: Publish to branch
        if: ${{ github.event.inputs.publish_branch != '' }}
        env:
          PUBLISH_BRANCH: ${{ github.event.inputs.publish_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # защита: не затирать исходную ветку
          case "$PUBLISH_BRANCH" in
            "$DEFAULT_BRANCH"|main|master)
              echo "FAIL: отказ публиковать в исходную ветку '$PUBLISH_BRANCH' (это force-push)"; exit 1 ;;
          esac

          touch site/.nojekyll
          git init -q
          git checkout -q -b "$PUBLISH_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy site ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

          REMOTE_HOST="${GITHUB_SERVER_URL#https://}"
          git push -f \
            "https://x-access-token:${GH_TOKEN}@${REMOTE_HOST}/${GITHUB_REPOSITORY}.git" \
            "HEAD:${PUBLISH_BRANCH}"
          echo "Опубликовано в ветку '$PUBLISH_BRANCH'"
